name: Release

# Runs on every push to main. When package.json names a version that has no
# tag yet, which is what merging a pull request from `pnpm release <bump>`
# does, it checks the code, tags the commit, publishes to npm through trusted
# publishing (no token; the package's npm settings name this repository and
# this workflow file) and makes the GitHub release. Any other push stops after
# the first job. If publishing fails, re-run the failed job: it skips a tag
# that already exists and a version that is already on npm.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        name: find an unreleased version
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # trusted publishing and provenance
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later; pinned to 11 so a new
      # major cannot change the publish step unannounced.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: test
        run: |
          export HOME="$(mktemp -d)"
          unset PI_CODING_AGENT_DIR XDG_STATE_HOME
          pnpm test
      - run: node scripts/check-pack.mjs
      - name: tag
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "pi-bg-bash $TAG"
            git push origin "$TAG"
          fi
      # Skipped when the version is already on npm: a re-run after a failed
      # GitHub release, or a version an owner published by hand.
      - name: npm publish
        run: |
          if [ -n "$(npm view "pi-bg-bash@${TAG#v}" version 2> /dev/null)" ]; then
            echo "pi-bg-bash@${TAG#v} is already on npm"
          else
            npm publish --provenance --access public
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
